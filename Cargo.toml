[workspace]
resolver = "2"
members = [
    "crates/mqueue-storage",
    "crates/mqueue-proto",
    "crates/mqueue-broker",
    "crates/mqueue-client",
    "crates/mqueue-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bytes = "1"
memmap2 = "0.9"
crc32fast = "1.4"
anyhow = "1"
thiserror = "1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"

mqueue-storage = { path = "crates/mqueue-storage" }
mqueue-proto = { path = "crates/mqueue-proto" }
mqueue-broker = { path = "crates/mqueue-broker" }
mqueue-client = { path = "crates/mqueue-client" }

[profile.release]
lto = "thin"
codegen-units = 1
